plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

System.setProperty('file.encoding', 'UTF-8')
tasks.withType(AbstractCopyTask).configureEach {
    filteringCharset = 'UTF-8'
}

version = project.mod_version
group = project.mod_group

base {
    archivesName = "modern-damage-system-fabric-26.3"
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://maven.isxander.dev/releases/" }
}

// 引用 common 模块的源码和资源
sourceSets {
    main {
        java {
            srcDirs += [
                project(':common').file('src/main/java'),
                'src/main/java'
            ]
        }
        resources {
            srcDirs += [
                project(':common').file('src/main/resources'),
                'src/main/resources'
            ]
        }
    }
}

dependencies {
    // Mod Menu（可选依赖，仅编译期）
    compileOnly fileTree(dir: 'C:/Users/Default/AppData/Roaming/.minecraft/versions/26.3-Fabric 0.19.5/mods', include: ['*modmenu*.jar'])
    // 26.3：LWJGL 编译依赖改为按目录匹配，避免写死版本号
    compileOnly fileTree(dir: "C:/Users/Default/AppData/Roaming/.minecraft/libraries/org/lwjgl",
        include: ["**/lwjgl-*.jar", "**/lwjgl-glfw-*.jar", "**/lwjgl-opengl-*.jar", "**/lwjgl-stb-*.jar"])
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation files("${gradle.gradleUserHomeDir}/caches/fabric-loom/${project.minecraft_version}/minecraft-merged.jar")
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly files("C:/Users/Default/AppData/Roaming/.minecraft/versions/26.3-Fabric 0.19.5/mods/cloth-config-26.3.158.jar")
}

processResources {
    inputs.property "version", project.version
    filteringCharset = "UTF-8"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching("fabric.mod.json") {
        // 26.3：不用 expand（Groovy 模板会把 JSON 里的 \n 转义变成真换行 -> 非法 JSON）
        filter { line -> line.replace('${version}', project.version.toString()) }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
    it.classpath += files("${gradle.gradleUserHomeDir}/caches/fabric-loom/${project.minecraft_version}/minecraft-merged.jar")
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('sourcesJar') {
    exclude("assets/criticalhits/textures/item/mds_api_icon.png")
}

jar {
    from("LICENSE") {
        rename { "${it}_modern-damage-system" }
    }
    exclude("com/juzipi/criticalhits/api/**")
    exclude("assets/criticalhits/textures/item/mds_api_icon.png")
    exclude("assets/criticalhits/textures/entity/**")
    exclude("assets/criticalhits/textures/gui/armor_tab_icon.png")
    exclude("assets/criticalhits/textures/gui/critical_tab_icon.png")
}
