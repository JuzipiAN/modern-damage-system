plugins {
    id 'java'
}

version = project.mod_version
group = project.mod_group

base {
    archivesName = 'modern-damage-system-neoforge-26.3'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

// ===== Plan B：不使用 moddev 插件（maven.neoforged.net 本机连不上），
//       直接把实例里已装好的 NeoForge 与各前置 jar 加进编译 classpath =====
def MCDIR = 'C:/Users/Default/AppData/Roaming/.minecraft'
def INST  = MCDIR + '/versions/26.3-NeoForge_26.3.0.83'

sourceSets {
    main {
        java {
            srcDirs += [project(':common').file('src/main/java'), 'src/main/java']
        }
        resources {
            srcDirs += [project(':common').file('src/main/resources'), 'src/main/resources']
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // NeoForge 打补丁后的 MC（40MB，含 NeoForge 本体）
    implementation files(INST + '/26.3-NeoForge_26.3.0.83.jar')
    // 实例 libraries 里的全部依赖（含 mixin / asm / gson / netty / lwjgl 等）
    implementation fileTree(dir: MCDIR + '/libraries', include: ['**/*.jar'])
    // 各前置模组（直接取实例 mods 里的）
    implementation files(
        INST + '/mods/bettercombat-neoforge-3.2.2+26.3.jar',
        INST + '/mods/cloth-config-neoforge-26.3.159.jar',
        INST + '/mods/MaxHealthFix-neoforge-MC26.3-26.3.0.1.jar',
        INST + '/mods/[属性修复] AttributeFix-neoforge-MC26.3-26.3.0.1.jar'
    )
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-nowarn']
}

processResources {
    inputs.property 'version', project.version
    filteringCharset = 'UTF-8'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('META-INF/neoforge.mods.toml') {
        filter { line -> line.replace('${version}', project.version.toString()) }
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // 与原始构建一致：主模组不打包 API 专属资源
    exclude('com/juzipi/criticalhits/api/**')
    exclude('assets/criticalhits/textures/item/mds_api_icon.png')
    exclude('assets/criticalhits/textures/entity/**')
    manifest {
        attributes([
            'Specification-Title'     : 'criticalhits',
            'Specification-Vendor'    : 'Juzipi_AN',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'Juzipi_AN'
        ])
    }
}


// sourcesJar 里 common 与 neoforge 的源目录有重名文件，需要去重策略
tasks.named('sourcesJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
