[[mods]]
modId="criticalhits"
version="${version}"
displayName="现代化伤害系统丨Modern Damage System"
authors="Juzipi_AN"
logoFile="assets/criticalhits/icon_256.png"
displayURL="https://www.curseforge.com/minecraft/mc-mods/modern-damage-system"
description="现代化伤害系统：把原版战斗重做成「伤害乘区」体系。26 种攻击与防御附魔、MDS 合成台、可配置战斗面板、40 个成就，以及敌对生物的附魔适配；移除跳劈必暴击。\n\nModern Damage System rebuilds combat around a damage-multiplier system: 26 attack and defense enchantments, an MDS crafting station, a configurable combat HUD, 40 achievements and enchanted hostile mobs. The jump-crit rule is gone.\n\n必选前置 / Requires: NeoForge, Better Combat, AttributeFix, MaxHealth Fix, Cloth Config API, MDS API.\n\n许可证 / License: 自定义源代码公开协议 (Custom Source-available License, All Rights Reserved) —— 禁止未经书面授权移植、修改、分发至网易中国版我的世界。\n\nCurseForge: https://www.curseforge.com/minecraft/mc-mods/modern-damage-system  |  Source: https://github.com/JuzipiAN/modern-damage-system"

# Mixin 配置必须显式列出：FML 11 的 ModFileParser.getMixinConfigs 只读取这里的声明，
# 不会自动扫描 jar 里的 *.mixins.json。缺了这段，NeoForge 端所有 Mixin 都不会加载
# （不报错、但附魔/伤害系统全部静默失效）。
[[mixins]]
config = "criticalhits.mixins.json"

[[mixins]]
config = "criticalhits.client.mixins.json"

